<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f7f8fa" />
    <meta
      name="description"
      content="NovaUI Core — a hands-on studio for accessible React components, interactions, and automated tests."
    />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>NovaUI Core · Component Studio</title>
    <script>
      try {
        document.documentElement.dataset.theme =
          localStorage.getItem("novaui-theme") === "dark" ? "dark" : "light";
      } catch {
        document.documentElement.dataset.theme = "light";
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
